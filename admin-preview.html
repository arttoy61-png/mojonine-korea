<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOJONINE KOREA · 데모 접수함</title><style>:root{--g:#153f31;--o:#f2a35d;--bg:#f6f3ed;--line:#ddd8cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:#18211d}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}.head{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.tag{font-size:11px;color:#fff;background:var(--g);border-radius:999px;padding:7px 10px}main{padding:44px 0}h1{font-size:42px;letter-spacing:-.05em;margin:0}.desc{color:#6d716e;font-size:13px;margin:10px 0 28px}.notice{padding:13px 14px;border:1px dashed #c8a87e;background:#fff9ed;border-radius:10px;color:#6d5840;font-size:12px}.table{margin-top:18px;background:#fff;border:1px solid var(--line)}.row{display:grid;grid-template-columns:150px 1.4fr 1fr 110px;gap:16px;padding:15px 16px;border-bottom:1px solid #eee9e2;align-items:center}.row.head{background:#f0ece4;font-size:11px;font-weight:900}.row:last-child{border-bottom:0}.row b{font-size:13px}.row small{display:block;color:#7a7d79;margin-top:3px}.status{justify-self:start;background:#e9f2ed;color:var(--g);padding:6px 8px;border-radius:7px;font-size:11px;font-weight:800}.empty{padding:40px;text-align:center;color:#777}.tools{display:flex;gap:8px;margin-top:18px}.tools button,.tools a{border:0;background:var(--g);color:#fff;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:800;text-decoration:none}.tools button.secondary{background:#ded8cf;color:#263b32}@media(max-width:700px){h1{font-size:34px}.row{grid-template-columns:1fr}.row.head{display:none}.status{justify-self:start}}</style></head><body><header><div class="wrap head"><div class="brand">MOJONINE KOREA</div><span class="tag">RECEIVER DEMO</span></div></header><main><div class="wrap"><h1>데모 주문 접수함</h1><p class="desc">주문자 화면의 ‘테스트 주문 접수’가 같은 브라우저에 저장되면 여기에서 확인됩니다.</p><div class="notice">실제 서버 접수함이 아닙니다. 주문자·접수자 흐름 검수용 데모입니다. 실제 운영에서는 카페24 관리자 주문으로 대체합니다.</div><div class="tools"><a href="index.html">← 주문자 화면</a><button class="secondary" id="clear">데모 접수 비우기</button></div><div class="table" id="table"></div></div></main><script>const PRODUCTS={sweet:{name:'황금한입 고구마칩',unit:'박스'},dryer:{name:'HANBUL 헤어드라이어',unit:'개'},sesame:{name:'오모나 참깨강정',unit:'박스'}};function render(){const list=JSON.parse(localStorage.getItem('m9-demo-orders')||'[]');const el=document.getElementById('table');if(!list.length){el.innerHTML='<div class="empty">아직 데모 접수 내역이 없습니다.</div>';return}el.innerHTML='<div class="row head"><span>접수번호</span><span>주문내용</span><span>거래처</span><span>상태</span></div>'+list.map(o=>{const items=Object.entries(o.cart||{}).filter(([,q])=>q>0).map(([id,q])=>`${PRODUCTS[id].name} ${q}${PRODUCTS[id].unit}`).join('<br>');return `<div class="row"><div><b>${o.code}</b><small>${new Date(o.created).toLocaleString('ko-KR')}</small></div><div>${items}</div><div><b>${o.company||'-'}</b><small>${o.contact||'-'} · ${o.phone||'-'}</small><small>${o.address||'-'}</small></div><span class="status">테스트 접수</span></div>`}).join('')}render();document.getElementById('clear').onclick=()=>{localStorage.removeItem('m9-demo-orders');render()}</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOJONINE KOREA · 데모 주문 접수함</title><style>:root{--g:#153f31;--o:#f2a35d;--bg:#f6f3ed;--line:#ddd8cf;--muted:#737771}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:#18211d}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}.head{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.tag{font-size:11px;color:#fff;background:var(--g);border-radius:999px;padding:7px 10px}main{padding:46px 0}h1{font-size:44px;letter-spacing:-.055em;margin:0}.desc{color:var(--muted);font-size:14px;margin:10px 0 26px}.notice{padding:13px 14px;border:1px dashed #c8a87e;background:#fff9ed;border-radius:10px;color:#6d5840;font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tools button,.tools a{border:0;background:var(--g);color:#fff;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:800;text-decoration:none}.tools button.secondary{background:#ded8cf;color:#263b32}.list{display:grid;gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.orderTop{display:grid;grid-template-columns:170px 1.2fr 1fr 150px;gap:18px;align-items:start}.code{font-weight:900}.date{display:block;color:var(--muted);font-size:11px;margin-top:3px}.block b{display:block;font-size:12px;margin-bottom:5px}.block p{margin:0;color:#555;font-size:13px;line-height:1.55;white-space:pre-line}.status select{width:100%;border:1px solid #d8d8d3;background:#fff;border-radius:9px;padding:9px;font-size:12px}.memo{margin-top:14px;padding-top:12px;border-top:1px solid #eee9e2;color:#666;font-size:12px}.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px;text-align:center;color:#777}@media(max-width:780px){h1{font-size:34px}.orderTop{grid-template-columns:1fr}.status select{max-width:180px}}</style></head><body><header><div class="wrap head"><div class="brand">MOJONINE KOREA</div><span class="tag">RECEIVER DEMO</span></div></header><main><div class="wrap"><h1>데모 주문 접수함</h1><p class="desc">주문자 화면에서 접수한 테스트 주문을 같은 브라우저에서 확인하고 상태를 바꿔볼 수 있습니다.</p><div class="notice">실제 서버 접수함이 아닙니다. 실제 운영에서는 카페24 관리자 주문 및 배송관리 화면으로 대체합니다. 실제 개인정보를 입력하지 마세요.</div><div class="tools"><a href="index.html">← 주문자 화면</a><button id="reload">새로고침</button><button class="secondary" id="clear">데모 접수 비우기</button></div><div class="list" id="list"></div></div></main><script>const PRODUCTS={sweet:{name:'황금한입 고구마칩',unit:'박스'},dryer:{name:'HANBUL 헤어드라이어',unit:'개'},sesame:{name:'오모나 참깨강정',unit:'박스'}};const STATUS=['신규 접수','확인','출고 준비','발송 완료'];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function read(){try{const v=JSON.parse(localStorage.getItem('m9-demo-orders')||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function save(v){localStorage.setItem('m9-demo-orders',JSON.stringify(v))}function render(){const data=read();const el=document.getElementById('list');if(!data.length){el.innerHTML='<div class="empty">아직 데모 접수 내역이 없습니다.</div>';return}el.innerHTML=data.map((o,idx)=>{const items=Object.entries(o.cart||{}).filter(([,q])=>Number(q)>0).map(([id,q])=>`${esc(PRODUCTS[id]?.name||id)} ${Number(q)}${esc(PRODUCTS[id]?.unit||'')}`).join('<br>');const status=o.status||'신규 접수';return `<article class="order"><div class="orderTop"><div><span class="code">${esc(o.code)}</span><span class="date">${esc(new Date(o.created).toLocaleString('ko-KR'))}</span></div><div class="block"><b>주문 내용</b><p>${items||'-'}</p></div><div class="block"><b>거래처 / 배송</b><p>${esc(o.company||'-')}\n${esc(o.contact||'-')} · ${esc(o.phone||'-')}\n${esc(o.address||'-')}</p></div><div class="status"><b style="display:block;font-size:12px;margin-bottom:5px">처리 상태</b><select data-status="${idx}">${STATUS.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="memo"><b>요청사항</b> · ${esc(o.memo||'없음')}</div></article>`}).join('');document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{const v=read();if(v[Number(s.dataset.status)]){v[Number(s.dataset.status)].status=s.value;save(v)}})}document.getElementById('reload').onclick=render;document.getElementById('clear').onclick=()=>{if(confirm('데모 접수 내역을 모두 비울까요?')){localStorage.removeItem('m9-demo-orders');render()}};render();</script></body></html>
